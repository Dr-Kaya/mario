<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Gogh's Starry Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Van Gogh's Starry Adventure</h1>
        <div class="info-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="lives">Lives: <span id="lives">3</span></div>
            <div class="stars">Stars: <span id="stars">0</span>/5</div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <p><strong>Controls:</strong></p>
            <p>Arrow Keys or WASD to move</p>
            <p>Space or Up Arrow to jump</p>
            <p>Collect all 5 stars to win!</p>
        </div>
        <div id="gameOver" class="game-message hidden">
            <h2>Game Over!</h2>
            <p id="gameOverMessage"></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
